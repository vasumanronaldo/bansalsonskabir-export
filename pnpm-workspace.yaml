# pnpm 11 config. Prebuilt native binaries ship for darwin-arm64; postinstall
# scripts are optional. Skip the pre-run deps check that blocks scripts here.
verifyDepsBeforeRun: false
onlyBuiltDependencies:
  - '@tailwindcss/oxide'
  - sharp
  - unrs-resolver
  - esbuild
allowBuilds:
  '@tailwindcss/oxide': set this to true or false
  esbuild: set this to true or false
  sharp: set this to true or false
  unrs-resolver: set this to true or false
